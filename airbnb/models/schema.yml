models:
  - name: fct_reviews
    columns:
      - name: review_id
        data_tests:
          - unique
          - not_null

  - name: dim_hosts_cleansed
    description: Cleansed table of Airbnb hosts. NULL names replaced with 'Anonymous'.
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: Primary key for the host.
        data_type: string
        constraints:
          - type: not_null
         
        data_tests:
          - unique
          - not_null

      - name: host_name
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - not_null

      - name: is_superhost
        description: "'t' if the host is a superhost, 'f' if not. NULL for 15 hosts with incomplete records."
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: created_at
        data_type: timestamp


  - name: dim_listings_cleansed
    description: Cleansed table containing Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          
    columns:
      - name: listing_id
        description: Primary key for the listing.
        data_tests:
          - unique
          - not_null

      - name: listing_name
        data_tests:
          - not_null


      - name: room_type
        description: Type of the apartment / room.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: host_id
        description: The host's ID. References the host table

        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      
      - name: minimum_nights
        data_tests:
          - positive_values
        

      - name: price
        description: Nightly price in USD. NULL when the source sent 0 (unknown price, e.g. 8 Berlin hotels).
        data_tests:
          - positive_values

 
      